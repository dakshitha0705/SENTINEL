{% extends "base.html" %}{% block body %}
<div class="card"><h1>Account</h1><table>
<tr><th>Username</th><td>{{ u.username }}</td></tr><tr><th>Name</th><td>{{ u.name }}</td></tr>
<tr><th>Department</th><td>{{ u.dept }}</td></tr><tr><th>Role</th><td>{{ u.role }}</td></tr>
<tr><th>Groups</th><td>{{ groups|join(', ') or 'none' }}</td></tr>
<tr><th>Session source address</th><td>{{ session_ip }}</td></tr>
<tr><th>Signed in at</th><td>{{ login_at|int }} (epoch)</td></tr></table></div>{% endblock %}
