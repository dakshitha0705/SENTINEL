[browser]
# Offline requirement: never send usage statistics.
gatherUsageStats = false

[server]
headless = true
address = "127.0.0.1"
port = 8501
maxUploadSize = 200
fileWatcherType = "none"

[client]
toolbarMode = "minimal"
showErrorDetails = true

[theme]
base = "dark"
primaryColor = "#C8AA7C"
backgroundColor = "#0D1716"
secondaryBackgroundColor = "#1C2B29"
textColor = "#E3DCCD"
font = "sans serif"
