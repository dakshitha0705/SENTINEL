[browser]
# Offline requirement: never send usage statistics.
gatherUsageStats = false

[server]
headless = true
address = "127.0.0.1"
port = 8501
maxUploadSize = 200
fileWatcherType = "none"

[client]
toolbarMode = "minimal"
showErrorDetails = true

[theme]
base = "dark"
primaryColor = "#D9A35B"
backgroundColor = "#070F0C"
secondaryBackgroundColor = "#141D1A"
textColor = "#E2DACB"
font = "sans serif"
