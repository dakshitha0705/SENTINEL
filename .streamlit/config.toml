[browser]
# Offline requirement: never send usage statistics.
gatherUsageStats = false

[server]
headless = true
address = "127.0.0.1"
port = 8501
maxUploadSize = 200
fileWatcherType = "none"

[client]
toolbarMode = "minimal"
showErrorDetails = true

[theme]
base = "dark"
primaryColor = "#E3A587"
backgroundColor = "#0B2226"
secondaryBackgroundColor = "#12323A"
textColor = "#E7DFD0"
font = "sans serif"
