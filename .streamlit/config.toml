[browser]
# Offline requirement: never send usage statistics.
gatherUsageStats = false

[server]
headless = true
address = "127.0.0.1"
port = 8501
maxUploadSize = 200
fileWatcherType = "none"

[client]
toolbarMode = "minimal"
showErrorDetails = true

[theme]
base = "dark"
primaryColor = "#E1AD9D"
backgroundColor = "#103943"
secondaryBackgroundColor = "#164652"
textColor = "#E7DFD0"
font = "sans serif"
